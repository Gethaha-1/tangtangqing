[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Runtime variables must be available to Functions in the target site.
# Keep Next.js API routes: never upload public/ledger as a static-only site.
